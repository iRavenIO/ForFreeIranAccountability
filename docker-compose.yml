version: '3.8'

services:
  accountability:
    container_name: accountability-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/db/accountability.db
      DATABASE_URL: file:/app/db/accountability.db
      INTERNAL_ADMIN_TOKEN: change-me
      NEXT_PUBLIC_SITE_URL: https://accountability.forfreeiran.com
    volumes:
      - ./db:/app/db:ro
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health',function(r){process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

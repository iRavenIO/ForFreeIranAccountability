apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: iran-accountability-clone-template
spec:
  templates:
    - name: clone
      inputs:
        parameters:
          - name: repository
          - name: branch
            default: main
          - name: commit
      volumes:
        - name: workspace
          emptyDir: {}
      outputs:
        artifacts:
          - name: source
            path: /workspace/source
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            git clone --depth 1 --branch {{inputs.parameters.branch}} {{inputs.parameters.repository}} /workspace/source
            cd /workspace/source
            if [ -n "{{inputs.parameters.commit}}" ] && [ "{{inputs.parameters.commit}}" != "{{"{{$}}"}}" ]; then
              git fetch origin {{inputs.parameters.commit}}
              git checkout {{inputs.parameters.commit}}
            fi
            echo "Repository cloned successfully"
            git log --oneline -3
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

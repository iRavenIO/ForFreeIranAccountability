apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: iran-accountability-clone-template
spec:
  templates:
    - name: clone
      inputs:
        parameters:
          - name: repository
          - name: branch
            default: main
          - name: commit
            default: ""
      volumes:
        - name: workspace
          emptyDir: {}
      outputs:
        artifacts:
          - name: source
            path: /workspace/source
      container:
        image: harbor-registry.tail02a6d.ts.net/library/alpine-ci:3.18
        command: [sh, -c]
        args:
          - |
            REPO_URL=$(echo "{{inputs.parameters.repository}}" | sed 's|git@github.com:|https://x-access-token:'"${GITHUB_TOKEN}"'@github.com/|')
            echo "Cloning $REPO_URL (branch: {{inputs.parameters.branch}})"
            rm -rf /workspace/source
            git clone --depth 1 --branch "{{inputs.parameters.branch}}" "$REPO_URL" /workspace/source
            cd /workspace/source
            if [ -n "{{inputs.parameters.commit}}" ]; then
              git fetch origin "{{inputs.parameters.commit}}"
              git checkout "{{inputs.parameters.commit}}"
            fi
            echo "Clone OK"
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

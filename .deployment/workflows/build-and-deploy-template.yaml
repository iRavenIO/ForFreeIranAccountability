apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: iran-accountability-build-and-deploy-template
spec:
  entrypoint: build-and-deploy-dag
  arguments:
    parameters:
      - name: repository
        value: "git@github.com:iRavenIO/ForFreeIranAccountability.git"
      - name: branch
        value: main
      - name: commit
      - name: docker-tag
      - name: namespace
  templates:
    - name: build-and-deploy-dag
      dag:
        tasks:
          - name: clone-repo
            templateRef:
              name: iran-accountability-clone-template
              template: clone
            arguments:
              parameters:
                - name: repository
                  value: "{{workflow.parameters.repository}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: commit
                  value: "{{workflow.parameters.commit}}"

          - name: build-amd64
            depends: clone-repo
            templateRef:
              name: iran-accountability-build-template
              template: build-image
            arguments:
              parameters:
                - name: docker-tag
                  value: "{{workflow.parameters.docker-tag}}"
                - name: arch
                  value: amd64

          - name: build-arm64
            depends: clone-repo
            templateRef:
              name: iran-accountability-build-template
              template: build-image
            arguments:
              parameters:
                - name: docker-tag
                  value: "{{workflow.parameters.docker-tag}}"
                - name: arch
                  value: arm64

          - name: create-manifest
            depends: build-amd64 && build-arm64
            templateRef:
              name: iran-accountability-build-template
              template: create-manifest-list
            arguments:
              parameters:
                - name: docker-tag
                  value: "{{workflow.parameters.docker-tag}}"

          - name: update-version
            depends: create-manifest
            templateRef:
              name: iran-accountability-git-template
              template: update-version
            arguments:
              parameters:
                - name: docker-tag
                  value: "{{workflow.parameters.docker-tag}}"
                - name: git-email
                  value: "ci@iraven.io"
                - name: git-name
                  value: "CI Bot"

          - name: deploy-ha00
            depends: update-version
            template: deploy-argocd
            arguments:
              parameters:
                - name: cluster
                  value: k3s-ha00
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"

    - name: deploy-argocd
      inputs:
        parameters:
          - name: cluster
          - name: namespace
      container:
        image: alpine/curl:latest
        command: [sh, -c]
        args:
          - |
            echo "Syncing ArgoCD app: iran-accountability on {{inputs.parameters.cluster}}"
            ARGOCD_SERVER="argocd-server.argo-cd.svc.cluster.local:443"
            curl -s -X POST "https://${ARGOCD_SERVER}/api/v1/applications/iran-accountability/sync" \
              -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"revision":"main","prune":false}' || echo "Sync triggered via ArgoCD"
        env:
          - name: ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: argocd-token
                key: token
